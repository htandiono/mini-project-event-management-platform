name: Bug report
description: Capture a reproducible defect.
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Sign in as...
        2. Open...
        3. Submit...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: branch
    attributes:
      label: Branch or commit
    validations:
      required: true
